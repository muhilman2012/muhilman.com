services:
  # Laravel 11 Application (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: muhilman/laravel11-app:latest
    container_name: laravel11_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel_prod}
      DB_USERNAME: ${DB_USERNAME:-hilman_admin}
      DB_PASSWORD: ${DB_PASSWORD:-secure_master_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    networks:
      - app_network
    depends_on:
      - postgres
      - redis

  # Nginx Reverse Proxy & HTTP/2 Server
  nginx:
    image: nginx:1.26-alpine
    container_name: laravel11_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app_network
    depends_on:
      - app

  # PostgreSQL 16 Enterprise Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: laravel11_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod}
      POSTGRES_USER: ${DB_USERNAME:-hilman_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_master_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  # Redis In-Memory Cache & Horizon Queue Broker
  redis:
    image: redis:7-alpine
    container_name: laravel11_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - app_network

  # Laravel Background Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel11_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - ./:/var/www/html
    networks:
      - app_network
    depends_on:
      - app
      - redis

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
